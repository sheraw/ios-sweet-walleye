name: xnu

on:
  push:
    # Fork of stossy11/ios-sweet for the Pixel 2 (walleye / MSM8998) port.
    # Pushing should just build, without anyone clicking a button: the defaults
    # below are the ones this port needs (xnu-8796.141.3, SWEET machine config,
    # DEVELOPMENT so the kernel keeps its symbols while bring-up is unfinished,
    # and metroid_early off so xnu/patches/ is copied verbatim - the Metroid
    # staging step is for Nothing Phone (3), not for us).
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: Kernel configuration (RELEASE is optimized and stripped)
        type: choice
        options: [RELEASE, DEVELOPMENT, DEBUG]
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      metroid_early:
        description: "Nothing Phone (3): portable SWEET support plus Metroid hardware overlays"
        type: boolean
        default: false
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  
concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # On a push there are no inputs at all, so this must default to off rather than
  # to "true just because it is not a dispatch".
  METROID_EARLY: ${{ inputs.metroid_early && 'true' || 'false' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    # Needed by the "Publish kernel" step at the end, which pushes to the
    # kernels branch with the workflow's own token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          if [[ "$METROID_EARLY" == true ]]; then
            [[ "$MACHINE_CONFIG" == SWEET && "$MACOS_VERSION" == 13.5 ]] || exit 1
            python3 tools/stage-metroid-patches.py dxb/patches
          else
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          fi
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='kernel.release.*' --exclude='kernel.debug.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Verify optimized RELEASE and strip boot kernel
        id: release_kernel
        if: ${{ success() && env.KERNEL_CONFIG == 'RELEASE' }}
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib, os, shlex, shutil, struct, subprocess, sys
          sys.path.insert(0, 'tools')
          from mkpayload import parse_macho

          machine = os.environ['MACHINE_CONFIG'].lower()
          name = 'kernel.release.' + machine
          kernel = Path('out') / name
          if not kernel.is_file():
              raise SystemExit('Missing RELEASE kernel: ' + str(kernel))
          configs = list(Path('dxb/build/xnu.obj').glob('RELEASE_ARM64_*/*/RELEASE/.CFLAGS'))
          if not configs:
              raise SystemExit('No RELEASE arm64 compiler flags found')
          for config in configs:
              flags = shlex.split(config.read_text().strip('\0\n'))
              optimization = [f for f in flags if f.startswith('-O')]
              if not optimization or optimization[-1] not in ('-O2', '-O3', '-Os', '-Oz'):
                  raise SystemExit('Unoptimized RELEASE flags: ' + str(config))
              # XNU has DEBUG/DEVELOPMENT options, but no RELEASE define.
              if any(f in flags for f in ('-DDEBUG', '-DDEBUG=1', '-DDEVELOPMENT', '-DDEVELOPMENT=1')):
                  raise SystemExit('Debug/development configuration: ' + str(config))
              print(str(config) + ': RELEASE ' + optimization[-1])

          symbols = Path('out-symbols')
          symbols.mkdir(exist_ok=True)
          unstripped = list(Path('dxb/build').rglob(name + '.unstripped'))
          if len(unstripped) != 1:
              raise SystemExit('Expected one unstripped RELEASE image, found ' + str(len(unstripped)))
          shutil.copy2(unstripped[0], symbols / (name + '.unstripped'))
          for debug in list(Path('out').glob('*.link')) + list(Path('out').glob('*.dSYM')):
              shutil.move(str(debug), str(symbols / debug.name))

          def executable_sections(data):
              ncmds = struct.unpack_from('<I', data, 16)[0]
              offset, sections = 32, []
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', data, offset)
                  if cmd == 0x19:  # LC_SEGMENT_64
                      count = struct.unpack_from('<I', data, offset + 64)[0]
                      for index in range(count):
                          section = offset + 72 + 80 * index
                          address, length, fileoff = struct.unpack_from('<QQI', data, section + 32)
                          flags = struct.unpack_from('<I', data, section + 64)[0]
                          if flags & 0x80000400:  # instruction section
                              sections.append((data[section:section + 32], address, length,
                                  hashlib.sha256(data[fileoff:fileoff + length]).digest()))
                  offset += size
              if not sections:
                  raise SystemExit('No executable kernel sections found')
              return sections

          before_data = kernel.read_bytes()
          before = parse_macho(before_data)
          stripped = kernel.with_name(name + '.stripped')
          subprocess.run(['xcrun', 'strip', '-S', '-x', str(kernel), '-o', str(stripped)], check=True)
          after_data = stripped.read_bytes()
          after = parse_macho(after_data)
          if executable_sections(before_data) != executable_sections(after_data):
              raise SystemExit('Stripping changed executable kernel sections')
          if before['entry'] is None or before['entry'] != after['entry']:
              raise SystemExit('Stripping lost/changed LC_UNIXTHREAD entry')
          if before['cputype'] != after['cputype'] or before['cpusub'] != after['cpusub']:
              raise SystemExit('Stripping changed architecture')
          if machine == 'sweet' and (after['cputype'] != 0x100000c or after['cpusub'] != 0):
              raise SystemExit('SWEET requires plain arm64')
          data = stripped.read_bytes()
          _, _, _, _, ncmds, _, _, _ = struct.unpack_from('<8I', data)
          offset = 32
          for _ in range(ncmds):
              cmd, size = struct.unpack_from('<II', data, offset)
              if cmd == 2:  # LC_SYMTAB: no STAB debug or local named symbols.
                  symoff, count, stroff, strsize = struct.unpack_from('<4I', data, offset + 8)
                  for index in range(count):
                      string, kind, section, desc, value = struct.unpack_from('<IBBHQ', data, symoff + index * 16)
                      if kind & 0xe0 or (string and not (kind & 1)):
                          raise SystemExit('Debug/local symbol remains after RELEASE strip')
              offset += size
          stripped.replace(kernel)
          with Path('out/SHA256SUMS').open('w') as checksum:
              for image in sorted(Path('out').glob('kernel.*')):
                  if image.is_file():
                      checksum.write(hashlib.sha256(image.read_bytes()).hexdigest() + '  ' + image.name + '\n')
          print('PASS: optimized RELEASE kernel, local/debug symbols stripped, boot entry retained')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('verified=true\n')
          PYVERIFY

      - uses: actions/upload-artifact@v4
        if: ${{ success() && env.KERNEL_CONFIG == 'RELEASE' && steps.release_kernel.outputs.verified == 'true' }}
        with:
          name: xnu-symbols
          path: out-symbols/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ success() && (env.KERNEL_CONFIG != 'RELEASE' || steps.release_kernel.outputs.verified == 'true') }}
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      # Artifact downloads need an authenticated API call, which a plain SSH
      # user cannot make. Committing the kernels to a branch means anyone with
      # push access (i.e. the person running the port) can `git fetch kernels`.
      - name: Publish kernel to the kernels branch
        if: always()
        # GITHUB_TOKEN is not exported to the shell by itself; without this env
        # the push URL ends up as "https://x-access-token:@github.com/..." and
        # is rejected. The previous attempts failed for exactly that reason.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/pub
          find out -maxdepth 1 -type f -name 'kernel.*' -exec cp {} /tmp/pub/ \; 2>/dev/null || true
          [ -n "$(ls -A /tmp/pub 2>/dev/null)" ] || { echo "no kernel to publish"; exit 0; }
          cd /tmp/pub
          shasum -a 256 kernel.* > SHA256SUMS || true
          ls -la
          git init -q .
          git config user.name  "xnu-build"
          git config user.email "xnu-build@users.noreply.github.com"
          git add -A
          git commit -q -m "kernel build ${GITHUB_RUN_NUMBER}: ${KERNEL_CONFIG} ${MACHINE_CONFIG}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/kernels
